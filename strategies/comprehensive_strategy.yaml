instructions: |
  **全面分析策略（Comprehensive Analysis Strategy）**

  ## 核心理念
  本策略整合了两大系统的精华：
  - **daily_stock_analysis** 的所有专业策略（通用综合分析、均线金叉、缩量回踩、放量突破等）
  - **TradingAgents-astock** 的7大分析师维度 + 多空辩论机制

  采用多维融合分析框架，避免单一策略的局限性，是常规个股分析的默认策略。

  ---

  ## 分析维度体系

  ### 维度一：宏观与行业（权重 15%）
  **分析要点：**
  - 货币政策（利率、准备金率、货币供应量）
  - 财政政策（税收、政府支出、基建）
  - 宏观经济数据（GDP、CPI/PPI、PMI、就业）
  - 国际贸易环境与地缘政治风险
  - 行业景气度与周期位置
  - 政策扶持/打压方向
  - 行业竞争格局与集中度

  **工具调用：** `get_sector_rankings` 了解板块轮动和相对强弱

  **评分调整：**
  - 宏观环境友好 + 行业景气：`sentiment_score +8`
  - 行业政策利好：`sentiment_score +5`

  ---

  ### 维度二：公司基本面（权重 20%）
  **分析要点：**
  - 业绩（净利润增速是核心）
  - 营业收入增长
  - 毛利率/净利率（定价权和成本控制）
  - ROE（股东回报）
  - 现金流质量（经营现金流与净利润比值）
  - 资产负债状况
  - 估值水平（PE/PB、PEG、前向PE）

  **工具调用：** `get_stock_info` 获取基本面数据

  **评分调整：**
  - 收入、利润、现金流和 ROE 同向改善：`sentiment_score +15`
  - 行业景气与公司新闻互相验证：额外 `+6`
  - 高估值但成长未验证：`sentiment_score -8`
  - 增收不增利或现金流恶化：`sentiment_score -12`
  - 基本面恶化或行业政策利空：`sentiment_score -15`

  ---

  ### 维度三：技术面（权重 25%）
  **整合策略：**

  1. **趋势判断**（通用综合分析核心）
     - MA5 > MA10 > MA20 且 MA20 斜率向上，视为多头结构
     - 乖离率分析：<2%为最佳买点区间，>5%不追高
     - 多头排列 + 趋势强度良好 + 量价配合：`sentiment_score +12`
     - 跌破 MA20 或趋势转弱：`sentiment_score -12`

  2. **均线金叉**（ma_golden_cross）
     - MA5 上穿 MA10，配合量能放大
     - MA10 上穿 MA20（更慢但更可靠）
     - MA5 × MA10 金叉配合量能：`sentiment_score +10`
     - MA10 × MA20 金叉：`sentiment_score +8`
     - MACD 零轴上方金叉：额外 `+5`

  3. **缩量回踩**（shrink_pullback）
     - 价格回踩至 MA5/MA10 附近
     - 回调期间成交量 < 5日均量的70%
     - 最佳买点设在 MA5 水平
     - 缩量回踩 MA5：`sentiment_score +10`
     - 回踩关键均线后企稳 + 基本面支撑：`sentiment_score +10`

  4. **放量突破**（volume_breakout）
     - 当日成交量 > 5日均量的2倍
     - 收盘价站上阻力位
     - 放量突破确认：`sentiment_score +12`
     - 突破伴随板块共振：额外 `+5`
     - 放量突破关键阻力 + 有催化剂：`sentiment_score +10`

  5. **箱体震荡**（box_oscillation）
     - 箱底区域（距支撑 ≤5%）：买入信号
     - 箱顶区域（距阻力 ≤5%）：减仓信号
     - 箱体有效突破：转为趋势策略，`sentiment_score +15`
     - 箱底有效跌破：`sentiment_score -15`

  6. **缠论结构**（chan_theory）
     - 识别中枢结构和背驰信号
     - 一买（最强）：下跌趋势中底背驰，`sentiment_score +15`
     - 二买/三买共振：`sentiment_score +10`
     - 顶背驰 / 趋势向下：`sentiment_score -15`

  7. **波浪理论**（wave_theory）
     - 第2浪回调企稳（黄金坑）：`sentiment_score +15`
     - 第3浪突破确认：`sentiment_score +12`
     - 第5浪末端/顶背离：`sentiment_score -10`
     - C浪下跌中：`sentiment_score -12`

  8. **底部放量**（bottom_volume）
     - 股价跌幅 > 15%后，成交量 > 5日均量的3倍
     - 底部放量确认：`sentiment_score +8`
     - 配合阳线 + 新闻催化：额外 `+5`

  9. **一阳夹三阴**（one_yang_three_yin）
     - 大阳线 + 连续三根缩量阴线 + 突破阳线
     - 形态成立 + 趋势看多：`sentiment_score +15`

  **工具调用：** `get_daily_history` + `analyze_trend`

  ---

  ### 维度四：资金与情绪（权重 20%）
  **整合策略：**

  1. **情绪周期**（emotion_cycle）
     - 换手率 < 0.5%：市场冷淡，潜在底部
     - 换手率 0.5%~2%：正常交投
     - 换手率 2%~5%：活跃，不宜追高
     - 换手率 > 10%：极度过热，短期顶部
     - 情绪底部特征满足3项以上：`sentiment_score +14`
     - 情绪顶部特征满足3项以上：`sentiment_score -12`
     - 情绪顶部特征满足全部5项：`sentiment_score -20`

  2. **热点题材**（hot_theme）
     - 判断板块是否在涨幅、成交额或人气前列
     - 区分"实质受益""间接受益""概念关联较弱"
     - 热点启动或扩散期 + 个股实质受益：`sentiment_score +12`
     - 热点进入分化或退潮：`sentiment_score -8`
     - 仅概念蹭热点且乖离率过高：`sentiment_score -12`

  3. **龙头策略**（dragon_head）
     - 确认个股是否在板块启动周期中率先上涨
     - 换手率 > 5%，量比 > 1.5
     - 真正的龙头在上涨日应跑赢板块 2% 以上
     - 确认为龙头股：`sentiment_score +10`
     - 板块正处于主动轮动期：额外 `+5`

  4. **资金流向分析**（通用综合分析核心）
     - 机构资金流向
     - 北向资金动向
     - 融资融券余额变化
     - 股东户数变化（筹码集中度）
     - 市场情绪与风险偏好
     - 资金持续流出 + 情绪低迷：`sentiment_score -10`

  **工具调用：** `get_volume_analysis` + `get_realtime_quote` + `get_sector_rankings`

  ---

  ### 维度五：事件驱动（权重 15%）
  **整合策略：**

  1. **事件驱动**（event_driven）
     - 业绩类、政策类、订单/产品类、资本运作类、监管/风险类
     - 判断事件影响路径和市场反应程度
     - 高可信正向事件且价格尚未充分反映：`sentiment_score +14`
     - 正向事件已大幅兑现：`sentiment_score -6`
     - 负面事件仍在发酵：`sentiment_score -15`

  2. **预期重估**（expectation_repricing）
     - 正向预期差：市场原本悲观，新增信息好于预期
     - 负向预期差：市场原本乐观，新增信息低于预期
     - 正向预期差且价格尚未充分反映：`sentiment_score +15`
     - 正向预期差已被连续大涨兑现：`sentiment_score -5`
     - 负向预期差或核心假设被证伪：`sentiment_score -15`

  3. **新闻与公告分析**（通用综合分析核心）
     - 业绩预告/报告
     - 重大资产重组/并购
     - 高管增减持
     - 分红/送转
     - 公告与新闻

  **工具调用：** `search_stock_news`

  ---

  ### 维度六：风险控制（权重 5%）
  **风险排查重点：**
  - 减持公告、业绩预亏、监管处罚、行业政策利空、大额解禁
  - PE/PB 明显偏高时需在风险点中说明
  - 使用 `search_stock_news` 检查无重大利空

  ---

  ## 具体分析步骤（通用综合分析流程）

  **步骤1：技术面初筛**
  - 使用 `analyze_trend` 判断趋势状态
  - MA5 >= MA10 >= MA20 且 MA20 斜率向上，视为多头结构
  - 乖离率分析：<2%为最佳买点区间，>5%不追高

  **步骤2：基本面验证**
  - 使用 `get_stock_info` 了解公司基本面
  - 重点关注业绩增速、ROE、毛利率等核心指标
  - 评估当前估值水平（PE/PB）是否合理

  **步骤3：资金与情绪分析**
  - 使用 `get_volume_analysis` 分析量价配合
  - 缩量上涨需谨慎，放量滞涨需警惕分歧
  - 放量突破有效阻力时可提高胜率评级

  **步骤4：行业与宏观环境**
  - 使用 `get_sector_rankings` 了解板块表现
  - 评估整体市场环境对个股的影响

  **步骤5：事件与新闻**
  - 使用 `search_stock_news` 查找相关新闻
  - 识别近期可能影响股价的催化剂或风险

  ---

  ## 多空辩论机制

  参考 TradingAgents-astock 的辩论框架：

  **正方观点（看多）：**
  - 基本面改善：营收/利润增长、毛利率提升、ROE改善
  - 技术面走强：均线多头排列、放量突破、金叉信号
  - 资金面支持：北向资金流入、机构持仓增加
  - 事件催化：政策利好、订单中标、业绩超预期
  - 行业景气：板块轮动、行业政策扶持

  **反方观点（看空）：**
  - 基本面恶化：增收不增利、现金流恶化、商誉减值风险
  - 技术面走弱：均线空头排列、放量下跌、顶背离
  - 资金面流出：北向资金流出、股东户数增加
  - 风险事件：减持计划、限售解禁、监管处罚
  - 估值压力：PE/PB过高、估值透支未来增长

  **辩论规则：**
  1. 双方各提出3-5个核心论点
  2. 交叉反驳对方论点
  3. 综合权衡多空因素
  4. 形成最终投资建议

  ---

  ## 综合评分模型

  **评分计算：**
  综合得分 = (宏观行业得分 × 15%) + (基本面得分 × 20%) + 
             (技术面得分 × 25%) + (资金情绪得分 × 20%) + 
             (事件驱动得分 × 15%) + (风险调整 × 5%)

  **信号转换：**
  - 综合得分 ≥ 4.5 → strong_buy（强烈买入）
  - 综合得分 3.5-4.5 → buy（买入）
  - 综合得分 2.5-3.5 → hold（持有/观望）
  - 综合得分 1.5-2.5 → sell（卖出）
  - 综合得分 < 1.5 → strong_sell（强烈卖出）

  ---

  ## 输出要求

  1. **维度分析摘要**：分别给出六个维度的分析结论和评分
  2. **多空辩论总结**：清晰列出看多和看空的核心理由
  3. **综合评分**：给出最终综合得分和信号
  4. **操作建议**：
     - 明确的买入/观望/减仓倾向及触发条件
     - 止损参考（如 MA20 下方或结构低点）
     - 仓位建议
  5. **风险提示**：列出主要风险点和失效条件

  ---

  ## 核心交易规则（必须严格遵守）

  **1. 严进策略（不追高）**
  - 当股价偏离 MA5 超过 5% 时，坚决不买入
  - 乖离率 < 2%：最佳买点区间
  - 乖离率 2-5%：可小仓介入
  - 乖离率 > 5%：严禁追高！直接判定为"观望"

  **2. 趋势交易（顺势而为）**
  - 多头排列必须条件：MA5 > MA10 > MA20
  - 只做多头排列的股票，空头排列坚决不碰
  - 均线发散上行优于均线粘合

  **3. 效率优先（筹码结构）**
  - 关注筹码集中度：90%集中度 < 15% 表示筹码集中
  - 获利比例分析：70-90% 获利盘时需警惕获利回吐
  - 平均成本与现价关系：现价高于平均成本 5-15% 为健康

  **4. 买点偏好（回踩支撑）**
  - 最佳买点：缩量回踩 MA5 获得支撑
  - 次优买点：回踩 MA10 获得支撑
  - 观望情况：跌破 MA20 时观望

  **5. 风险排查重点**
  - 减持公告、业绩预亏、监管处罚、行业政策利空、大额解禁

  **6. 估值关注（PE/PB）**
  - PE 明显偏高时需在风险点中说明

  **7. 强势趋势股放宽**
  - 强势趋势股可适当放宽乖离率要求，轻仓追踪但需设止损

  ---

  ## 交易建议输出要求
  - 输出明确的"买入/观望/减仓"倾向及触发条件
  - 必须给出止损参考（如 MA20 下方或结构低点）
  - 结合六大因素综合给出风险收益比评估
  - 若无清晰优势，明确写"暂不出手"，避免过度交易

  ---

  ## 评分调整汇总

  **正向调整（加分）：**
  - 底背驰 + 一买信号：+15
  - 第2浪底部企稳（黄金坑）：+15
  - 一阳夹三阴形态成立 + 趋势看多：+15
  - 收入、利润、现金流和 ROE 同向改善：+15
  - 正向预期差且价格尚未充分反映：+15
  - 箱体向上有效突破：+15
  - 高可信正向事件且价格尚未充分反映：+14
  - 情绪底部特征满足3项以上：+14
  - 放量突破确认：+12
  - 第3浪突破确认：+12
  - 热点处于启动或扩散期 + 个股实质受益：+12
  - 多头排列 + 趋势强度良好 + 量价配合：+12
  - 缩量回踩 MA5：+10
  - 二买/三买共振：+10
  - MA5 × MA10 金叉配合量能：+10
  - 确认为龙头股：+10
  - 回踩关键均线后企稳 + 基本面支撑：+10
  - 放量突破关键阻力 + 有催化剂：+10
  - 底部放量确认：+8
  - MA10 × MA20 金叉：+8
  - 宏观环境友好 + 行业景气：+8
  - 行业景气与公司新闻互相验证：+6
  - 个股强于板块并有量能确认：+6
  - 板块正处于主动轮动期：+5
  - MACD 零轴上方金叉：+5
  - 突破伴随板块共振：+5
  - 底部放量配合阳线 + 新闻催化：+5
  - 行业政策利好：+5

  **负向调整（减分）：**
  - 情绪顶部特征满足5项：-20
  - 顶背驰 / 趋势向下：-15
  - 负面事件仍在发酵：-15
  - 负向预期差或核心假设被证伪：-15
  - 箱底有效跌破：-15
  - 基本面恶化或行业政策利空：-15
  - 情绪顶部特征满足3项以上：-12
  - C浪下跌中：-12
  - 增收不增利或现金流恶化：-12
  - 跌破 MA20 或趋势转弱：-12
  - 仅概念蹭热点且乖离率过高：-12
  - 高估值但成长未验证：-8
  - 热点进入分化或退潮：-8
  - 正向事件已大幅兑现：-6
  - 正向预期差已被连续大涨兑现：-5
  - 处于箱顶区域：-5
  - 资金持续流出 + 情绪低迷：-10
  - 第5浪末端/顶背离：-10
